<!-- HTML FORMS - User input elements -->

<!-- Form element - wraps input elements -->
<!-- action: URL to send data, method: GET or POST -->
<form action="/submit" method="POST">
    
    <!-- Text input - single line text -->
    <input type="text" name="username" placeholder="Enter username">
    
    <!-- Password input - hides characters -->
    <input type="password" name="password" placeholder="Enter password">
    
    <!-- Email input - validates email format -->
    <input type="email" name="email" placeholder="email@example.com">
    
    <!-- Number input - only accepts numbers, can set min/max -->
    <input type="number" name="age" min="0" max="120">
    
    <!-- Tel input - for phone numbers -->
    <input type="tel" name="phone" placeholder="123-456-7890">
    
    <!-- URL input - validates URL format -->
    <input type="url" name="website" placeholder="https://example.com">
    
    <!-- Date input - date picker -->
    <input type="date" name="birthdate">
    
    <!-- Time input - time picker -->
    <input type="time" name="appointment">
    
    <!-- Datetime-local input - date and time picker -->
    <input type="datetime-local" name="meeting">
    
    <!-- Color input - color picker -->
    <input type="color" name="favorite-color" value="#ff0000">
    
    <!-- Range input - slider -->
    <input type="range" name="volume" min="0" max="100" value="50">
    
    <!-- File input - file upload -->
    <input type="file" name="document">
    
    <!-- File input with accept - limits file types -->
    <input type="file" name="image" accept="image/*">
    
    <!-- File input multiple - allows multiple files -->
    <input type="file" name="documents" multiple>
    
    <!-- Hidden input - not visible, sends data with form -->
    <input type="hidden" name="user-id" value="12345">
    
    <!-- Checkbox - on/off toggle -->
    <input type="checkbox" name="subscribe" id="subscribe">
    <label for="subscribe">Subscribe to newsletter</label>
    
    <!-- Checkbox checked by default -->
    <input type="checkbox" name="terms" id="terms" checked>
    <label for="terms">I agree to terms</label>
    
    <!-- Radio buttons - select one from group (same name) -->
    <input type="radio" name="gender" value="male" id="male">
    <label for="male">Male</label>
    
    <input type="radio" name="gender" value="female" id="female">
    <label for="female">Female</label>
    
    <!-- Textarea - multi-line text input -->
    <!-- rows/cols control size -->
    <textarea name="message" rows="5" cols="30" placeholder="Enter message"></textarea>
    
    <!-- Select dropdown - choose one option -->
    <select name="country">
        <option value="">Select country</option>
        <option value="us">United States</option>
        <option value="uk">United Kingdom</option>
        <option value="ca">Canada</option>
    </select>
    
    <!-- Select with optgroup - groups related options -->
    <select name="car">
        <optgroup label="German">
            <option value="audi">Audi</option>
            <option value="bmw">BMW</option>
        </optgroup>
        <optgroup label="Japanese">
            <option value="toyota">Toyota</option>
            <option value="honda">Honda</option>
        </optgroup>
    </select>
    
    <!-- Select multiple - choose multiple options (hold Ctrl/Cmd) -->
    <select name="skills" multiple>
        <option value="html">HTML</option>
        <option value="css">CSS</option>
        <option value="js">JavaScript</option>
    </select>
    
    <!-- Label - associates text with input, clicking label focuses input -->
    <!-- for attribute matches input id -->
    <label for="username">Username:</label>
    <input type="text" name="username" id="username">
    
    <!-- Button - clickable button -->
    <button type="button">Click Me</button>
    
    <!-- Submit button - submits form -->
    <button type="submit">Submit</button>
    
    <!-- Reset button - clears form inputs -->
    <button type="reset">Reset</button>
    
    <!-- Input submit button - alternative to button type="submit" -->
    <input type="submit" value="Submit Form">
    
    <!-- Fieldset - groups related form elements -->
    <!-- Legend - title for fieldset -->
    <fieldset>
        <legend>Personal Information</legend>
        <input type="text" name="firstname" placeholder="First Name">
        <input type="text" name="lastname" placeholder="Last Name">
    </fieldset>
    
    <!-- Datalist - provides autocomplete suggestions -->
    <input list="browsers" name="browser">
    <datalist id="browsers">
        <option value="Chrome">
        <option value="Firefox">
        <option value="Safari">
    </datalist>
    
</form>

<!-- Input attributes -->

<!-- required - field must be filled -->
<input type="text" name="username" required>

<!-- readonly - cannot be modified but is submitted -->
<input type="text" name="id" value="12345" readonly>

<!-- disabled - cannot be modified or submitted, grayed out -->
<input type="text" name="old-field" disabled>

<!-- maxlength - limits character count -->
<input type="text" name="username" maxlength="20">

<!-- minlength - requires minimum characters -->
<input type="text" name="password" minlength="8">

<!-- pattern - validates against regex -->
<input type="text" name="zip" pattern="[0-9]{5}" title="5-digit ZIP code">

<!-- autocomplete - enables/disables browser autocomplete -->
<input type="email" name="email" autocomplete="email">

<!-- autofocus - automatically focuses this input on page load -->
<input type="text" name="search" autofocus>
